# Cornix RF-stable balanced profile.
# This shared file is applied to both cornix_left and cornix_right.

# nRF52840 maximum BLE transmit power on both halves.
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Prefer the more robust/compatible BLE 1M PHY by disabling 2M PHY.
CONFIG_BT_CTLR_PHY_2M=n

# Reduce unnecessary battery-level traffic: report every 5 minutes.
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=300

# Required by the converted Vial mouse-key layer on both split builds.
CONFIG_ZMK_POINTING=y

# Distinguish this firmware from the stock RMK pairing entry.
CONFIG_ZMK_KEYBOARD_NAME="Cornix ZMK"

# Keep optional visual features disabled for the stability-focused build.
CONFIG_ZMK_DISPLAY=n
CONFIG_ZMK_RGB_UNDERGLOW=n

# Runtime per-connection BLE TX power controls (TX 0 / + / - / MAX).
CONFIG_BT_HCI_VS=y
CONFIG_BT_CTLR_TX_PWR_DYNAMIC_CONTROL=y

# Korean STENO mode and exact-mask abbreviation dictionary.
CONFIG_CORNIX_STENO=y
CONFIG_CORNIX_STENO_MAX_POSITIONS=50
CONFIG_CORNIX_STENO_CHORD_SETTLE_MS=40
CONFIG_CORNIX_STENO_KEYUP_CORRECTION_MS=50
CONFIG_CORNIX_STENO_LATE_TAP_MAX_MS=120
CONFIG_CORNIX_STENO_DUAL_TAPPING_TERM_MS=200
CONFIG_CORNIX_STENO_OUTPUT_QUEUE_SIZE=256
CONFIG_CORNIX_STENO_OUTPUT_HOLD_MS=4
CONFIG_CORNIX_STENO_OUTPUT_GAP_MS=4
CONFIG_CORNIX_STENO_DICTIONARY=y
