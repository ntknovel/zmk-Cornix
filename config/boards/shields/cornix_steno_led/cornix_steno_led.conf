# SPDX-License-Identifier: MIT
# cornix_indicator owns the WS2812 hardware, normal battery/Bluetooth status,
# and the one-second idle power-off. This companion shield adds only the
# STENO mode-entry flash, held-key counter, and runtime On/Off toggle.
CONFIG_CORNIX_STENO_LED=y
CONFIG_CORNIX_STENO_LED_ENTRY_FLASH_MS=600
CONFIG_CORNIX_STENO_LED_REASSERT_DELAY_MS=40

# BASE should be dark after a normal connection indication finishes.
CONFIG_RGBLED_WIDGET_SHOW_CAPSLOCK=n
CONFIG_RGBLED_WIDGET_SHOW_LAYER_CHANGE=n
CONFIG_RGBLED_WIDGET_SHOW_LAYER_COLORS=n

# Treat 20% and below as the visible low-battery warning range.
CONFIG_RGBLED_WIDGET_BATTERY_LEVEL_CRITICAL=20
